<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{{ .Title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { max-width: 700px; margin: 40px auto; padding: 0 20px; font-family: -apple-system, sans-serif; line-height: 1.8; color: #333; }
    h1 { margin-bottom: 0.5em; }
    .date { color: #888; font-size: 0.9em; margin-bottom: 2em; }
  </style>
</head>
<body>
  <article>
    <h1>{{ .Title }}</h1>
    <div class="date">{{ .Date.Format "2006-01-02" }}</div>
    <div class="content">
      {{ .Content }}
    </div>
  </article>
</body>
</html>
