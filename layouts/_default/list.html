<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{{ .Site.Title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { max-width: 700px; margin: 40px auto; padding: 0 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.8; color: #222; }
    h1 { margin-bottom: 1em; font-size: 24px; }
    ul { list-style: none; padding: 0; }
    li { margin-bottom: 16px; display: flex; align-items: baseline; }
    a { text-decoration: none; color: #0969da; font-size: 16px; font-weight: 500; }
    a:hover { text-decoration: underline; }
    .date { color: #888; font-size: 14px; margin-right: 15px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>{{ .Site.Title }}</h1>
  <ul>
    {{ range .Site.RegularPages }}
      <li>
        <span class="date">{{ .Date.Format "2006-01-02" }}</span>
        <a href="{{ .RelPermalink | relURL }}">{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>
</body>
</html>
