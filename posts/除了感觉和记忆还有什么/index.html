<!doctype html><html lang=zh-CN><head><meta charset=utf-8><title>除了感觉和记忆还有什么？</title>
<meta name=viewport content="width=device-width,initial-scale=1"><style>body{max-width:700px;margin:40px auto;padding:0 20px;font-family:-apple-system,sans-serif;line-height:1.8;color:#333}h1{margin-bottom:.5em}.date{color:#888;font-size:.9em;margin-bottom:2em}</style></head><body><article><h1>除了感觉和记忆还有什么？</h1><div class=date>2026-10-03</div><div class=content><p>这个世界之所以存在，是因为我们感觉到了它的存在。

除此之外，对于个体的你我来说，我想不出来还有其它什么东西能够留下来？</p></div></article></body></html>
